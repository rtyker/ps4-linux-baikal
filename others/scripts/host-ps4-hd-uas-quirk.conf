# Installed on the host PC as /etc/modprobe.d/ps4-hd-uas-quirk.conf
#
# The JMicron USB-SATA bridge 152d:0578 that holds the PS4 Linux HD gave read errors and bus resets
# when used in UAS mode on this host. The "u" quirk makes usb-storage ignore UAS for this one device
# ID, so it uses the plain bulk-only protocol. Other USB disks are not affected.
#
# Without this file the quirk only lasts until the next reboot of the PC.
# To undo: delete /etc/modprobe.d/ps4-hd-uas-quirk.conf and reload usb-storage (or reboot).
options usb-storage quirks=152d:0578:u
